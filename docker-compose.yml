services:
  postgres:
    image: postgres:16
    container_name: atmosphere-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: atm
      POSTGRES_PASSWORD: atm
      POSTGRES_DB: atmosphere
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  postgres_data:
